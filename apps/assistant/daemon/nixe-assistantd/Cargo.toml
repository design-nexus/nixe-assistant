[package]
name = "nixe-assistantd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local voice assistant daemon for Omarchy"

[[bin]]
name = "nixe-assistantd"
path = "src/main.rs"

[[bin]]
name = "nixe-assistant"
path = "src/cli.rs"

[dependencies]
serde.workspace = true
tempfile.workspace = true
anyhow.workspace = true
chrono.workspace = true
assistant-agent.workspace = true
assistant-audio.workspace = true
assistant-core.workspace = true
assistant-inference.workspace = true
assistant-ipc.workspace = true
assistant-omarchy.workspace = true
assistant-tools.workspace = true
dirs.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
cuda = ["assistant-inference/cuda"]
