[assistant]
name = "Echo"
mode = "push-to-talk"
prompt = "You are {name}, a fast local voice assistant on Omarchy/Hyprland. Answer questions out loud in short spoken sentences. No markdown, no bullet lists, no code fences. Never claim you changed the computer."

[stt]
provider = "voxtype"

[llm]
backend = "llama.cpp"
model = "auto"
n_gpu_layers = -1
ctx = 4096
n_predict = 256
temperature = 0.7
flash_attn = true
prefix_cache = true
n_batch = 2048
n_ubatch = 512

[tts]
provider = "kokoro"
voice = "af_heart"
speed = 1.0
device = "cuda"
variant = "fp32"
# variant = "quantized" # Int8 quantized ONNX, 92MB, faster CPU synthesis with AVX-VNNI
# threads = 4          # Intra-op CPU threads (default: ONNX Runtime auto)
force_cuda = false    # Force CUDA attempt on Blackwell sm_120 despite missing ORT cubins

[vad]
enabled = true
backend = "silero"
threshold = 0.5 # Silero speech probability
energy_threshold = 0.012 # RMS fallback and energy backend
hangover_ms = 400
start_confirm_frames = 2
model = ""
url = "https://github.com/snakers4/silero-vad/raw/master/src/silero_vad/data/silero_vad.onnx"

[audio]
capture_rate = 16000
playback_rate = 24000
source = "default"
sink = "default"

[barge_in]
enabled = true
grace_ms = 500
threshold = 0.08
hangover_ms = 160
aec = true

[wake_word]
enabled = true
threshold = 0.003
hangover_ms = 500
start_confirm_frames = 4
preroll_ms = 500
min_ms = 400
max_ms = 10000
hush_ms = 1200
prefixes = ["hey", "ok", "okay"]
phrases = ["echo", "ekko", "ecko", "eco", "eko", "hecho"]

[clock]
enabled = true
inject_prompt = true
time_format = "%-I:%M %p"
date_format = "%A, %B %-d"
time_template = "It's {time}."
date_template = "It's {date}."
prompt = "The current local time is {time}. Today's date is {date}. Use these when asked the time or date."
time_phrases = [
  "what time is it",
  "whats the time",
  "what is the time",
  "tell me the time",
  "tell me what time it is",
  "current time",
  "whats the current time",
  "what is the current time",
  "what time",
  "got the time",
  "do you have the time",
  "time is it",
]
date_phrases = [
  "whats the date",
  "what is the date",
  "what day is it",
  "whats today",
  "what is today",
  "whats todays date",
  "what is todays date",
  "tell me the date",
  "what date is it",
]
strip_tails = ["please", "now", "right now", "for me"]

[ui]
enabled = true

[permissions]
launch_app = "allow"
volume = "allow"
files_read = "allow"
files_write = "confirm"
shell = "deny"
shutdown = "confirm"

[agent]
enabled = true
default_agent = "agy" # "agy", "claude", "codex", "cursor"
terminal = "omarchy-launch-terminal"

[mcp]
enabled = true
# Configure external MCP servers over stdio here if desired:
# [mcp.servers.filesystem]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/absolute/path/to/allowed/directory"]

[http]
enabled = true
bind = "127.0.0.1"
port = 8765



# Listen briefly after replies; explicit conversation stays open until idle.
[conversation]
enabled = true
follow_up_secs = 10
idle_secs = 60

[dictation]
enabled = true
idle_secs = 120

[browser]
enabled = true
node = "nixe-assistant-node"
worker = "auto"
weather_location = ""
# Optional registered MCP search tool, e.g. "duckduckgo.search". Empty uses built-in search.
search_tool = ""

[terminal]
timeout_secs = 120
# [terminal.commands]
# project_status = ["git", "status", "--short"]


[location]
# On-demand approximate city from ipapi.co; cached in memory. No GPS tracking.
enabled = true
city = "" # Set a city/address to override automatic detection.
cache_minutes = 60
# Optional manually supplied coordinates require both latitude and longitude.
