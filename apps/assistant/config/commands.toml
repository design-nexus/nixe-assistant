# Desktop command phrases. Edit this file, then:
#   nixe-assistant reload
#
# `omarchy` is argv after the binary: omarchy <args>, or a typed Hyprland action
# when the first arg is "hypr": close_window, focus_workspace N|e+1|e-1|previous|
# special:NAME, move_to_workspace N|special:NAME [follow|stay], toggle_special NAME,
# float_toggle, toggle_split, focus_direction l|r|u|d, cycle_next, cycle_previous.
# Each is checked and confirmed afterwards. "hyprctl" works for dispatch (not exec),
# switchxkblayout, notify, dismissnotify and setcursor; anything else is refused.
# `{n}` in [workspace] is the spoken number.

