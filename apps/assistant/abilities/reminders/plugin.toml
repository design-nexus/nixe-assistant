manifest_version = 1
id = "reminders"
version = "1.2.0"
description = "Timers and reminders: Nyx Reminders' task lists when it's installed, else kept locally"
executable = "python3"
args = ["./main.py"]
tools = ["reminders.timer", "reminders.create", "reminders.list", "reminders.cancel", "reminders.snooze", "reminders.voice", "reminders.lists", "reminders.today", "reminders.search", "reminders.complete", "reminders.edit", "reminders.delete"]

[[routes]]
pattern = "^(?i:(?P<request>(?:set (?:a |an |the )?timer for|remind me (?:in|today|tomorrow)).+))$"
tool = "reminders.voice"
template = true

[[routes]]
pattern = "^(?i:(?P<request>(?:list (?:my )?(?:timers|reminders)|cancel (?:timer|reminder) .+|snooze (?:timer|reminder) .+)))$"
tool = "reminders.voice"
template = true

[[routes]]
pattern = "^(?i:(?P<request>a ?m|p ?m))$"
tool = "reminders.voice"
template = true

# What it may reach (see docs/PLUGINS.md).
[sandbox]
unconfined = "hands reminders to Nyx Reminders' task lists, starting it when needed"
