manifest_version = 1
id = "passwords"
version = "1.0.0"
description = "Nixe Passwords: find logins and copy them to the clipboard (the value never comes back)"
executable = "nixe-passwords-assistant"
args = []
tools = ["passwords.find", "passwords.copy"]

[[routes]]
pattern = "^(?i:copy (?:my |the )?(?:one-time )?(?P<field>password|username|code) for (?P<query>.+))$"
tool = "passwords.copy"
template = true

[[routes]]
pattern = "^(?i:find (?:my )?(?P<query>.+?) logins?)$"
tool = "passwords.find"
template = true

# The program comes with Nixe Passwords. Its daemon answers only the suite's own
# programs, found by their real path, and only when "Nixe Assistant" is turned on in
# Passwords' settings; every call also needs a key press here (`Secrets`).
[sandbox]
unconfined = "talks to Nixe Passwords' daemon, which accepts only its own programs"
