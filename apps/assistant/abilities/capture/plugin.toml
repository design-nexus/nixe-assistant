manifest_version = 1
id = "capture"
version = "1.1.0"
description = "Explicit clipboard capture and screen OCR"
executable = "python3"
args = ["./main.py"]
tools = ["capture.clipboard", "capture.screen"]

[[routes]]
pattern = "^(?i:read (?:my |the )?clipboard)$"
tool = "capture.clipboard"
template = true

[[routes]]
pattern = "^(?i:(?:read|capture|explain) (?:my |the )?screen)$"
tool = "capture.screen"
template = true

# What it may reach (see docs/PLUGINS.md). Empty: no network, no home folder.
[sandbox]
sockets = ["wayland"]
