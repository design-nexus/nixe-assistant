manifest_version = 1
id = "nyx-apps"
version = "1.4.0"
description = "The Nyx apps, worked directly (their control interface)"
executable = "python3"
args = ["./main.py"]
tools = ["notes.vault_status", "notes.vault_search", "notes.vault_read", "notes.vault_open", "notes.vault_create", "notes.vault_append", "notes.vault_replace", "notes.vault_proposal_status", "notes.clip", "notepad.new_tab", "notepad.open", "notepad.read", "notepad.tabs", "notepad.insert_text", "notepad.save", "write.new_document", "write.open", "write.read", "write.insert_text", "write.save", "write.export_pdf", "music.search", "music.play", "music.queue", "music.status", "music.control", "archive.list", "archive.open", "archive.extract", "archive.create", "chat.list", "chat.search", "chat.read", "chat.open", "chat.send", "fonts.installed", "fonts.search", "fonts.install", "photos.search", "photos.albums", "photos.open", "glimpse.search", "glimpse.show", "video.search", "video.play", "video.status", "video.control", "pdf.open", "pdf.read", "pdf.search", "pdf.go_to", "settings.pages", "settings.open", "store.search", "store.open", "tasks.top", "tasks.open", "torrents.list", "torrents.add", "torrents.pause", "torrents.resume", "contacts.find", "contacts.birthdays", "contacts.lists", "contacts.add", "contacts.update", "contacts.add_to_list", "theater.search", "theater.continue_watching", "theater.now_playing", "theater.play", "theater.control", "theater.mark_watched"]

[[routes]]
pattern = "^(?i:(?:open a )?new notepad tab)$"
tool = "notepad.new_tab"
template = true

[[routes]]
pattern = "^(?i:(?:start a )?new (?:write )?document in write)$"
tool = "write.new_document"
template = true

[[routes]]
pattern = "^(?i:what(?:'s| is) playing in music)$"
tool = "music.status"
template = true

# What it may reach (see docs/PLUGINS.md). Empty: no network, no home folder.
[sandbox]
unconfined = "starts the Nyx apps on the desktop"
