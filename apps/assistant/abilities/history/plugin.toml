manifest_version = 1
id = "history"
version = "1.2.0"
description = "Action history and conflict-safe undo"
executable = "python3"
args = ["./main.py"]
tools = ["history.list", "history.undo", "history.undo_task"]

[[routes]]
pattern = "^(?i:undo that)$"
tool = "history.undo"
template = true

[[routes]]
pattern = "^(?i:undo last action)$"
tool = "history.undo"
template = true

[[routes]]
pattern = "^(?i:undo (?:that|the last) task)$"
tool = "history.undo_task"
template = true

[[routes]]
pattern = "^(?i:show action history)$"
tool = "history.list"
template = true

# What it may reach (see docs/PLUGINS.md). Empty: no network, no home folder.
[sandbox]
