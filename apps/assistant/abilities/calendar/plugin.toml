manifest_version = 1
id = "calendar"
version = "1.2.0"
description = "Calendar: Nixe Calendar's calendars when it's installed, else a local calendar with ICS export"
executable = "python3"
args = ["./main.py"]
tools = ["calendar.list", "calendar.next", "calendar.read", "calendar.search", "calendar.free_slots", "calendar.create", "calendar.edit", "calendar.delete", "calendar.export", "calendar.undo"]

[[routes]]
pattern = "^(?i:(?:what\\x27s|what is) next on my calendar)$"
tool = "calendar.next"
template = true

[[routes]]
pattern = "^(?i:list (?:my )?calendar events)$"
tool = "calendar.list"
template = true

# What it may reach (see docs/PLUGINS.md).
[sandbox]
unconfined = "hands calendar requests to Nixe Calendar, starting it when needed"
