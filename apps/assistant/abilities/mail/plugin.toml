manifest_version = 1
id = "mail"
version = "1.0.0"
description = "Nyx Mail: search and read mail, and start messages for the user to check and send"
executable = "python3"
args = ["./main.py"]
tools = ["mail.search", "mail.inbox", "mail.read", "mail.open", "mail.draft"]

[[routes]]
pattern = "^(?i:(?:check|show|read) (?:my )?(?:new |unread )?(?:mail|email|inbox))$"
tool = "mail.inbox"
template = true

# What it may reach (see docs/PLUGINS.md).
[sandbox]
unconfined = "works Nyx Mail through its control interface, starting it when needed"
