[package]
name = "assistant-visual"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nyx Assistant Aura and Canvas"

[[bin]]
name = "nyx-assistant-visual"
path = "src/main.rs"

[dependencies]
assistant-core.workspace = true
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gtk4-layer-shell = "0.8"
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "938c638951a53f5874a8276d07ac9dcd68b191ad" }
serde_json.workspace = true
