[workspace]
resolver = "2"
members = [
    "crates/assistant-core",
    "crates/assistant-audio",
    "crates/assistant-inference",
    "crates/assistant-agent",
    "crates/assistant-tools",
    "crates/assistant-ipc",
    "crates/assistant-omarchy",
    "crates/assistant-tui",
    "crates/assistant-plugin-worker",
    "daemon/omarchy-assistantd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/design-nexus/omarchy-assistant"
authors = ["Ken Smith <ken@kensmith.dev>"]

[workspace.dependencies]
anyhow = "1"
assistant-agent = { path = "crates/assistant-agent" }
assistant-audio = { path = "crates/assistant-audio" }
assistant-core = { path = "crates/assistant-core" }
assistant-inference = { path = "crates/assistant-inference" }
assistant-ipc = { path = "crates/assistant-ipc" }
assistant-omarchy = { path = "crates/assistant-omarchy" }
assistant-tools = { path = "crates/assistant-tools" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
hound = "3"
notify = "8"
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "download-binaries",
    "tls-rustls",
    "api-22",
] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "process", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
